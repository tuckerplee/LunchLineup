# PostgreSQL configuration for LunchLineup
listen_addresses = '*'
hba_file = '/opt/lunchlineup/postgres/pg_hba.conf'
max_connections = 100
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
min_wal_size = 1GB
max_wal_size = 4GB
wal_level = replica
# WAL archiving is off by default. Compose sets archive_mode and archive_command
# from POSTGRES_ARCHIVE_MODE / POSTGRES_ARCHIVE_COMMAND; PGBACKREST_ENABLED=true makes
# the image entrypoint force archive_mode=on with the pgbackrest archive-push command
# (infrastructure/postgres/README.md). The fail-closed default command makes a
# mode-on-without-command mistake visible instead of silently discarding WAL.
archive_mode = off
archive_command = '/bin/false'
archive_timeout = 60s
max_wal_senders = 10
log_timezone = 'UTC'
timezone = 'UTC'
