# infrastructure/postgres/pg_hba.conf
# Client authentication for the Compose postgres service (hba_file in
# postgresql.conf; the file is mounted through /opt/lunchlineup/postgres).
#
# The postgres image otherwise generates a pg_hba.conf with "host all all all"
# and no replication entry; backups and PITR are estate pgBackRest, configured
# outside this stack, and need no replication connection from the data network.

# TYPE  DATABASE     USER  ADDRESS        METHOD
# Container-local socket only (entrypoint initialization and health checks).
local   all          all                  trust
host    all          all   127.0.0.1/32   scram-sha-256
host    all          all   ::1/128        scram-sha-256
# Application and migration clients on the internal Compose networks.
host    all          all   all            scram-sha-256
