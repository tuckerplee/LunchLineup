# infrastructure/postgres/pg_hba.conf
# Client authentication for the Compose postgres service (hba_file in
# postgresql.conf; the file is mounted through /opt/lunchlineup/pitr).
#
# The postgres image otherwise generates a pg_hba.conf with "host all all all"
# but no replication entry for non-loopback clients, so the pitr-base-backup
# job's pg_basebackup replication connection was rejected.

# TYPE  DATABASE     USER  ADDRESS        METHOD
# Container-local socket only (entrypoint initialization and health checks).
local   all          all                  trust
host    all          all   127.0.0.1/32   scram-sha-256
host    all          all   ::1/128        scram-sha-256
# Physical base backups: only peers on a network this server is directly
# attached to (the internal "data" network), and only with a password.
host    replication  all   samenet        scram-sha-256
# Application, migration and backup clients on the internal Compose networks.
host    all          all   all            scram-sha-256
