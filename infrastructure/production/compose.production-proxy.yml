# Production overlay: Caddy sits behind nginx CT940 (10.231.10.30; 10.1.20.20 after
# the renumbering, set CADDY_TRUSTED_PROXIES=10.1.20.20/32), which sits
# behind the Cloudflare Tunnel. TLS ends at Cloudflare; Caddy speaks plain HTTP on
# the VM's private IP only. Compose !override/!reset support required.
# PROXY_HTTP_BIND (the VM's private IPv4) comes from the runtime env and is
# validated by scripts/deploy-release.sh --target production (PROD_BIND_IP).
services:
  proxy:
    cap_add: !reset []
    ports: !override
      - target: 8080
        published: "80"
        host_ip: "${PROXY_HTTP_BIND:?Set PROXY_HTTP_BIND to the production VM private IP}"
        protocol: tcp
      # Estate Prometheus scrape port (token-protected metrics gateway; see
      # docs/estate/README.md). Same private bind address as the app port.
      - target: 9180
        published: "9180"
        host_ip: "${PROXY_HTTP_BIND:?Set PROXY_HTTP_BIND to the production VM private IP}"
        protocol: tcp
    environment:
      PRIVATE_APP_HOST: lunchlineup.com
      CADDY_SITE_ADDRESSES: http://lunchlineup.com
      CADDY_TRUSTED_PROXIES: "${CADDY_TRUSTED_PROXIES:-10.231.10.30/32}"
    volumes: !override
      - type: bind
        source: ./infrastructure/caddy/Caddyfile.production
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
