# LunchLineup alert rules for the ESTATE Prometheus (prometheus.int.tuckerl.ee).
#
# Copy this file into the estate Prometheus rule_files; estate-infra owns that
# step and the estate Alertmanager (alertmanager.int.tuckerl.ee) owns routing and
# mail. Nothing in this application stack evaluates or routes alerts.
#
# Label contract (see lunchlineup-targets.yml): every application series carries
# job="lunchlineup" and service=<api|api-v2|worker|engine|webhook-replay|control>,
# and the instance label of the application targets is the metrics gateway
# 10.231.10.108:9180 (VM107). Host metrics (node_exporter, including the textfile
# collector /var/lib/node_exporter/textfile_collector probes written by the systemd
# timers) use job="node" and are selected by the estate `host` label, not by instance:
# host="p1-lunchlineup-dev01" (estate labels site=p1, host=p1-lunchlineup-dev01,
# role=app, env=dev; target 10.231.10.108:9100; honor_labels true). When this is
# reused for another VM, change the gateway address and that host label.
#
# Dropped from the in-stack rule set: every rule about the removed in-stack
# components (backup freshness, base-backup freshness and WAL-archive health).
# Backup and PITR alerting belongs to the estate pgBackRest/restic monitoring.
groups:
  - name: lunchlineup.service
    interval: 1m
    rules:
      - alert: ServiceDown
        expr: up{job="lunchlineup"} == 0 or up{job="node",host="p1-lunchlineup-dev01"} == 0
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "{{ if $labels.service }}{{ $labels.service }}{{ else }}{{ $labels.job }}{{ end }} metrics scrape is down"
          description: "Prometheus cannot scrape {{ if $labels.service }}{{ $labels.service }}{{ else }}{{ $labels.job }}{{ end }} at {{ $labels.instance }}."
          runbook: "docs/runbooks/production-readiness.md"

      # Explicit expected instances survive a removed or accidentally retargeted
      # scrape. Services are reached through the token-protected metrics gateway
      # on the VM (docs/estate/README.md); node is the host node_exporter.
      - alert: ExpectedScrapeTargetMissing
        expr: |
          absent(up{job="lunchlineup",service="api",instance="10.231.10.108:9180"})
          or absent(up{job="lunchlineup",service="api-v2",instance="10.231.10.108:9180"})
          or absent(up{job="lunchlineup",service="engine",instance="10.231.10.108:9180"})
          or absent(up{job="lunchlineup",service="worker",instance="10.231.10.108:9180"})
          or absent(up{job="lunchlineup",service="webhook-replay",instance="10.231.10.108:9180"})
          or absent(up{job="lunchlineup",service="control",instance="10.231.10.108:9180"})
          or absent(up{job="node",host="p1-lunchlineup-dev01"})
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Expected {{ if $labels.service }}{{ $labels.service }}{{ else }}{{ $labels.job }}{{ end }} metrics target is missing"
          description: "Prometheus has no current up series for the expected {{ if $labels.service }}{{ $labels.service }}{{ else }}{{ $labels.job }}{{ end }} target {{ if $labels.host }}host {{ $labels.host }}{{ else }}{{ $labels.instance }}{{ end }}; another instance cannot satisfy this check."
          runbook: "docs/runbooks/monitoring-target-missing.md"

      - alert: NativeApiMetricsMissing
        expr: absent(up{job="lunchlineup",service="api-v2"})
        for: 2m
        labels:
          severity: critical
          team: ops
          service: api-v2
        annotations:
          summary: "Native API scrape configuration is missing"
          description: "Prometheus has no current api-v2 target series; native availability cannot be confirmed."
          runbook: "docs/runbooks/production-readiness.md"

      - alert: NativeApiHttpInstrumentationUnavailable
        expr: |
          (up{job="lunchlineup",service="api-v2"} == 1)
          unless on (job, instance)
          (lunchlineup_api_v2_http_instrumentation_ready{job="lunchlineup",service="api-v2"} == 1)
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Native API HTTP instrumentation is unavailable"
          description: "The native scrape succeeds but its initialized instrumentation marker is missing or zero."
          runbook: "docs/runbooks/production-readiness.md"

      - alert: PublicWebUnavailable
        expr: lunchlineup_public_web_probe_success{job="node",host="p1-lunchlineup-dev01"} == 0
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "LunchLineup public web edge is unavailable"
          description: "The bounded external HTTPS probe is failing; DNS, TLS, Caddy, or the Next.js root page is unavailable or serving the wrong release."
          runbook: "docs/runbooks/public-web-unavailable.md"

      - alert: PublicWebProbeStale
        expr: |
          time() - lunchlineup_public_web_probe_last_attempt_timestamp_seconds{job="node",host="p1-lunchlineup-dev01"} > 180
          or absent(lunchlineup_public_web_probe_last_attempt_timestamp_seconds{job="node",host="p1-lunchlineup-dev01"})
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "LunchLineup public web probe telemetry is stale"
          description: "The host probe has not published a current public edge result, so availability cannot be confirmed."
          runbook: "docs/runbooks/public-web-unavailable.md"

  - name: lunchlineup.api
    interval: 1m
    rules:
      # Alert when API error rate exceeds 5% for 2 minutes
      - alert: HighApiErrorRate
        expr: |
          (
            sum by (job, service, route) (rate(http_requests_total{job="lunchlineup",service="api",status=~"5.."}[5m]))
            /
            clamp_min(sum by (job, service, route) (rate(http_requests_total{job="lunchlineup",service="api"}[5m])), 0.001)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "High API error rate on {{ $labels.route }}"
          description: "{{ $labels.service }} is returning {{ $value | humanizePercentage }} 5xx errors."
          runbook: "docs/runbooks/high-error-rate.md"

      # Alert when p99 latency exceeds 2s
      - alert: HighApiLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, service, route) (rate(http_request_duration_ms_bucket{job="lunchlineup",service="api"}[5m]))
          ) > 2000
        for: 5m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "High API p99 latency"
          description: "p99 latency is {{ $value | humanize }}ms"
          runbook: "docs/runbooks/high-error-rate.md"

      - alert: ApiAvailabilityBudgetFastBurn
        expr: |
          ((((sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class="5xx"}[5m])) or vector(0)) / sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[5m]))) > (14.4 * 0.001)) and (sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[5m])) > 0))
          and
          ((((sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class="5xx"}[1h])) or vector(0)) / sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[1h]))) > (14.4 * 0.001)) and (sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[1h])) > 0))
        for: 2m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "API availability error budget is burning rapidly"
          description: "The 99.9% API availability SLO is consuming error budget above 14.4x across both five-minute and one-hour windows."
          runbook: "docs/runbooks/service-level-objectives.md"

      - alert: ApiAvailabilityBudgetSlowBurn
        expr: |
          ((((sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class="5xx"}[30m])) or vector(0)) / sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[30m]))) > (6 * 0.001)) and (sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[30m])) > 0))
          and
          ((((sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class="5xx"}[6h])) or vector(0)) / sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[6h]))) > (6 * 0.001)) and (sum(rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[6h])) > 0))
        for: 15m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "API availability error budget is burning persistently"
          description: "The 99.9% API availability SLO is consuming error budget above 6x across both 30-minute and six-hour windows."
          runbook: "docs/runbooks/service-level-objectives.md"

      - alert: PublicWebAvailabilityBudgetFastBurn
        expr: |
          (1 - avg_over_time(lunchlineup_public_web_probe_success{job="node",host="p1-lunchlineup-dev01"}[5m])) > (14.4 * 0.001)
          and
          (1 - avg_over_time(lunchlineup_public_web_probe_success{job="node",host="p1-lunchlineup-dev01"}[1h])) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Public web availability error budget is burning rapidly"
          description: "The 99.9% public web availability SLO is consuming error budget above 14.4x across both five-minute and one-hour windows."
          runbook: "docs/runbooks/service-level-objectives.md"

      - alert: PublicWebAvailabilityBudgetSlowBurn
        expr: |
          (1 - avg_over_time(lunchlineup_public_web_probe_success{job="node",host="p1-lunchlineup-dev01"}[30m])) > (6 * 0.001)
          and
          (1 - avg_over_time(lunchlineup_public_web_probe_success{job="node",host="p1-lunchlineup-dev01"}[6h])) > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Public web availability error budget is burning persistently"
          description: "The 99.9% public web availability SLO is consuming error budget above 6x across both 30-minute and six-hour windows."
          runbook: "docs/runbooks/service-level-objectives.md"

      - alert: RequiredApiDependencyUnavailable
        expr: |
          lunchlineup_dependency_up{job="lunchlineup",service="api",dependency=~"database|redis|rabbitmq"} == 0
          or absent(lunchlineup_dependency_up{job="lunchlineup",service="api",dependency="database"})
          or absent(lunchlineup_dependency_up{job="lunchlineup",service="api",dependency="redis"})
          or absent(lunchlineup_dependency_up{job="lunchlineup",service="api",dependency="rabbitmq"})
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Required API dependency {{ $labels.dependency }} is unavailable"
          description: "The API dependency health metric is zero or absent for {{ $labels.dependency }}."
          runbook: "docs/runbooks/production-readiness.md"

  - name: lunchlineup.native-api
    interval: 1m
    rules:
      - alert: HighNativeApiErrorRate
        expr: |
          (((sum by (job, service, route) (rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class="5xx"}[5m])) or on (job, service, route) (0 * sum by (job, service, route) (rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[5m])))) / sum by (job, service, route) (rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[5m]))) > 0.05)
          and on (job, service, route) (sum by (job, service, route) (rate(lunchlineup_api_v2_http_requests_total{job="lunchlineup",service="api-v2",scope="application",status_class=~"2xx|3xx|5xx"}[5m])) > 0)
        for: 2m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "High native API error rate on {{ $labels.route }}"
          description: "{{ $labels.service }} returns {{ $value | humanizePercentage }} completed 5xx responses among eligible application traffic."
          runbook: "docs/runbooks/high-error-rate.md"

      - alert: HighNativeApiLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le, job, service, route) (rate(lunchlineup_api_v2_http_request_duration_seconds_bucket{job="lunchlineup",service="api-v2",scope="application"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "High native API p99 latency"
          description: "Completed application request p99 is {{ $value | humanize }} seconds at the native front door."
          runbook: "docs/runbooks/high-error-rate.md"

  - name: lunchlineup.worker
    interval: 1m
    rules:
      - alert: WorkerJobFailures
        expr: sum by (type) (rate(lunchlineup_worker_jobs_total{status=~"failed|non_retryable"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Worker job failures for {{ $labels.type }}"
          description: "Worker jobs of type {{ $labels.type }} are failing at {{ $value }} jobs/s."
          runbook: "docs/runbooks/high-error-rate.md"

      - alert: PdfParserUnavailable
        expr: lunchlineup_pdf_parser_ready{job="lunchlineup",service="worker"} == 0
        for: 2m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Availability PDF parser is unavailable"
          description: "The worker cannot reach the isolated PDF parser; availability imports cannot complete."
          runbook: "docs/runbooks/production-readiness.md"

      - alert: PdfParserReadinessMissing
        expr: absent(lunchlineup_pdf_parser_ready{job="lunchlineup",service="worker"})
        for: 2m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Availability PDF parser readiness telemetry is missing"
          description: "Prometheus cannot confirm the isolated PDF parser is reachable from the worker."
          runbook: "docs/runbooks/production-readiness.md"

      - alert: PasswordResetEmailDeadLetters
        expr: sum(increase(lunchlineup_password_reset_email_total{job="lunchlineup",service="worker",status="dead_lettered"}[15m])) > 0
        for: 2m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "Password-reset email outbox has terminal delivery failures"
          description: "Recent password-reset terminal transitions require lifecycle or provider triage; the alert resolves after 15 minutes without a new dead letter."
          runbook: "docs/runbooks/outbound-delivery.md"

      - alert: PasswordResetEmailProviderOutage
        expr: lunchlineup_password_reset_email_systemic_provider_failure{job="lunchlineup",service="worker"} == 1
        for: 1m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Password-reset email provider delivery is systemically failing"
          description: "Recent bounded provider failures reached the worker readiness threshold."
          runbook: "docs/runbooks/outbound-delivery.md"

      - alert: PasswordResetEmailSweepStale
        expr: |
          lunchlineup_password_reset_email_sweep_running{job="lunchlineup",service="worker"} == 1
          and on(job, service)
          (time() - lunchlineup_password_reset_email_sweep_last_success_unixtime{job="lunchlineup",service="worker"} > 60)
        for: 1m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Password-reset email sweep success is stale"
          description: "The enabled sweep is running but has not completed a healthy cycle inside the readiness freshness bound."
          runbook: "docs/runbooks/outbound-delivery.md"

      - alert: StaffInvitationDeadLetters
        expr: sum(increase(lunchlineup_staff_invitation_outbox_total{job="lunchlineup",service="worker",status="dead_lettered"}[15m])) > 0
        for: 2m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "Staff invitation outbox has terminal delivery failures"
          description: "Recent terminal invitation transitions require triage by opaque outbox ID; resolve the cause, then use the tenant-scoped reissue action. The alert resolves after 15 minutes without a new dead letter."
          runbook: "docs/runbooks/outbound-delivery.md"

      - alert: StaffInvitationProviderOutage
        expr: lunchlineup_staff_invitation_systemic_provider_failure{job="lunchlineup",service="worker"} == 1
        for: 1m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Staff invitation provider delivery is systemically failing"
          description: "Recent bounded provider failures reached the readiness threshold; verify Resend status, credentials, and worker egress before retrying invitations."
          runbook: "docs/runbooks/outbound-delivery.md"

      - alert: StaffInvitationSweepNotReady
        expr: |
          (
            (
              lunchlineup_staff_invitation_sweep_running{job="lunchlineup",service="worker"} == 1
              and on(job, service)
              lunchlineup_staff_invitation_sweep_ready{job="lunchlineup",service="worker"} == 0
            )
            or absent(lunchlineup_staff_invitation_sweep_ready{job="lunchlineup",service="worker"})
          )
          unless on(job, service)
          lunchlineup_staff_invitation_systemic_provider_failure{job="lunchlineup",service="worker"} == 1
        for: 1m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Staff invitation sweep is not ready"
          description: "The enabled sweep is missing readiness telemetry or its latest cycle failed; inspect fixed-code worker logs plus database and platform-capability health before restoring readiness."
          runbook: "docs/runbooks/outbound-delivery.md"

      - alert: StaffInvitationSweepStale
        expr: |
          lunchlineup_staff_invitation_sweep_running{job="lunchlineup",service="worker"} == 1
          and on(job, service)
          lunchlineup_staff_invitation_systemic_provider_failure{job="lunchlineup",service="worker"} == 0
          and on(job, service)
          (
            time() - lunchlineup_staff_invitation_sweep_last_success_unixtime{job="lunchlineup",service="worker"}
            > on(job, service)
            lunchlineup_staff_invitation_sweep_max_staleness_seconds{job="lunchlineup",service="worker"}
          )
        for: 1m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Staff invitation sweep success is stale"
          description: "The enabled sweep exceeded its configured freshness bound; check database latency, provider latency, batch pressure, and the worker sweep task."
          runbook: "docs/runbooks/outbound-delivery.md"
      - alert: NotificationOutboxDeadLetters
        expr: sum(increase(lunchlineup_notification_outbox_total{job="lunchlineup",service="api",status="dead_lettered"}[15m])) > 0
        for: 2m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Notification outbox has terminal delivery failures"
          description: "Recent notification terminal transitions require operator triage; the alert resolves after 15 minutes without a new dead letter."
          runbook: "docs/runbooks/outbound-delivery.md"

      - alert: WebhookReplayNotReady
        expr: lunchlineup_webhook_replay_ready{job="lunchlineup",service="webhook-replay"} == 0
        for: 2m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Webhook replay worker is not ready"
          description: "The webhook replay worker metrics endpoint is reachable, but the worker is not consuming retry messages."
          runbook: "docs/runbooks/production-readiness.md"

      - alert: WebhookReplayFailures
        expr: sum by (status) (rate(lunchlineup_webhook_replay_messages_total{job="lunchlineup",service="webhook-replay",status=~"failed|dead_lettered|malformed"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Webhook replay failures for {{ $labels.status }}"
          description: "Webhook replay outcomes with status {{ $labels.status }} are occurring at {{ $value }} messages/s."
          runbook: "docs/runbooks/high-error-rate.md"

  - name: lunchlineup.engine
    interval: 1m
    rules:
      # Alert when solver queue gets backed up
      - alert: SolverQueueBacklog
        expr: sum(lunchlineup_solver_queue_messages{job="lunchlineup",service="worker",state=~"ready|retry"}) > 20
        for: 5m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "Solver queue is building up"
          description: "{{ $value }} solve jobs are ready or waiting in durable retry queues."
          runbook: "docs/runbooks/high-cpu.md"

      # A single durable poison item must remain alertable until the DLQ is drained.
      - alert: SolverQueuePoisoned
        expr: |
          max(lunchlineup_solver_queue_messages{job="lunchlineup",service="worker",state="dead_letter"}) > 0
          or
          sum(increase(lunchlineup_solver_terminal_transitions_total{job="lunchlineup",service="worker"}[15m])) > 0
        for: 0m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Solver queue contains terminal messages"
          description: "At least one solver message is in the durable DLQ or entered a terminal broker state within 15 minutes."
          runbook: "docs/runbooks/high-cpu.md"

      # Alert on solver error spikes
      - alert: SolverErrors
        expr: rate(lunchlineup_solver_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Solver returning errors"
          description: "Solver is failing at {{ $value }} errors/s"
          runbook: "docs/runbooks/high-error-rate.md"

  - name: lunchlineup.infrastructure
    interval: 1m
    rules:
      # Alert on disk space running low in containers
      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{job="node",host="p1-lunchlineup-dev01",fstype!~"tmpfs|overlay|squashfs|aufs"}
            /
            node_filesystem_size_bytes{job="node",host="p1-lunchlineup-dev01",fstype!~"tmpfs|overlay|squashfs|aufs"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining."
          runbook: "docs/runbooks/database-failover.md"

      - alert: HostFilesystemTelemetryMissing
        expr: absent(node_filesystem_size_bytes{job="node",host="p1-lunchlineup-dev01"})
        for: 15m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Host filesystem telemetry is missing"
          description: "Prometheus has no node filesystem metrics, so disk exhaustion alerts cannot fire."
          runbook: "docs/runbooks/production-readiness.md"

  - name: lunchlineup.retention
    interval: 1m
    rules:
      - alert: RetentionPurgeTelemetryMissing
        expr: absent(lunchlineup_retention_purge_last_attempt_timestamp_seconds{mode="dry_run",stage="retained_records"})
        for: 30m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Retained-record purge telemetry is missing"
          description: "Prometheus cannot confirm the scheduled retained-record purge dry-run."
          runbook: "docs/runbooks/data-retention-delete-export.md"

      - alert: RetentionPurgeStale
        expr: time() - lunchlineup_retention_purge_last_attempt_timestamp_seconds{mode="dry_run",stage="retained_records"} > 93600
        for: 15m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Retained-record purge dry-run is stale"
          description: "The last retained-record purge dry-run is {{ $value | humanizeDuration }} old."
          runbook: "docs/runbooks/data-retention-delete-export.md"

      - alert: ApplicationDataRetentionExecutionTelemetryMissing
        expr: absent(lunchlineup_retention_purge_last_attempt_timestamp_seconds{mode="execute",stage="application_data"})
        for: 30m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Automatic application-data retention execution telemetry is missing"
          description: "Prometheus cannot confirm the scheduled application_data execution; retained-record dry-run success does not satisfy this alert."
          runbook: "docs/runbooks/data-retention-delete-export.md"

      - alert: ApplicationDataRetentionExecutionStale
        expr: time() - lunchlineup_retention_purge_last_attempt_timestamp_seconds{mode="execute",stage="application_data"} > 93600
        for: 15m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Automatic application-data retention execution is older than 26 hours"
          description: "The last scheduled application_data execution attempt is {{ $value | humanizeDuration }} old; dry-run telemetry is intentionally independent."
          runbook: "docs/runbooks/data-retention-delete-export.md"

      - alert: RetentionPurgeFailed
        expr: lunchlineup_retention_purge_last_success == 0
        for: 15m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Retained-record purge invocation failed"
          description: "The last retained-record purge invocation in {{ $labels.mode }} mode failed."
          runbook: "docs/runbooks/data-retention-delete-export.md"

      - alert: RetentionPurgeCandidatesReady
        expr: lunchlineup_retention_purge_last_candidate_tenants{mode="dry_run"} > 0
        for: 15m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Retained-record purge candidates need review"
          description: "{{ $value }} tenant(s) reached retained database-record purge eligibility in the latest dry-run."
          runbook: "docs/runbooks/data-retention-delete-export.md"

  - name: lunchlineup.tenant-deletion-billing
    interval: 1m
    rules:
      - alert: TenantDeletionBillingBacklogSustained
        expr: |
          lunchlineup_tenant_deletion_billing_reconciliation_backlog{job="lunchlineup",service="api"} > 0
          and on(app, job, service)
          lunchlineup_tenant_deletion_billing_reconciliation_oldest_pending_age_seconds{job="lunchlineup",service="api"} > 900
        for: 10m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "Tenant deletion billing reconciliation backlog is sustained"
          description: "At least one deletion billing barrier has remained pending for more than 15 minutes; inspect bounded outcome counters and exact-fence retry state."
          runbook: "docs/runbooks/data-retention-delete-export.md"

      - alert: TenantDeletionBillingSweepStale
        expr: |
          (
            time() - lunchlineup_tenant_deletion_billing_reconciliation_last_success_timestamp_seconds{job="lunchlineup",service="api"}
            > on(app, job, service)
            lunchlineup_tenant_deletion_billing_reconciliation_sweep_max_staleness_seconds{job="lunchlineup",service="api"}
          )
          or absent(lunchlineup_tenant_deletion_billing_reconciliation_last_success_timestamp_seconds{job="lunchlineup",service="api"})
        for: 5m
        labels:
          severity: critical
          team: engineering
        annotations:
          summary: "Tenant deletion billing successful sweep is stale"
          description: "The API has not completed a successful deletion billing reconciliation sweep inside its exported freshness bound; failed sweeps do not refresh this alert."
          runbook: "docs/runbooks/data-retention-delete-export.md"
